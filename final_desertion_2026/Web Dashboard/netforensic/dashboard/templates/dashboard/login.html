<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetForensic - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { 
            background: linear-gradient(135deg, #1a1e2c 0%, #2d3349 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        .btn-primary { background-color: #1a1e2c; border: none; }
        .btn-primary:hover { background-color: #2d3349; }
    </style>

</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fas fa-shield-alt fa-3x text-dark"></i>
            <h2 class="mt-2">AI Network Forensics</h2>
            <p class="text-muted">Login in to access the dashboard</p>
        </div>

        <!-- Django shows login errors here -->
        {% if form.errors %}
            <div class="alert alert-danger" role="alert">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        
        <!-- Link to Register -->
        <p class="text-center mt-3">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>
        </p>
        <p class="text-center text-muted mt-2 small">AI Network Forensics</p>
    </div>
</body>
</html>
